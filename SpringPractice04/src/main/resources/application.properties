# ✅ 禁用 LiveReload（防止 WebKit 图形崩溃）
spring.devtools.livereload.enabled=false

# ✅ 启用重启机制（默认 true，可省略）
spring.devtools.restart.enabled=true

# ✅ 如果你希望更安全，可加这一句：避免不必要的 classloader 报错
spring.devtools.restart.exclude=static/**,public/**