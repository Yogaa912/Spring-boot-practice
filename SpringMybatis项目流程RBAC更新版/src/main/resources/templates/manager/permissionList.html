<script type="text/javascript">

/* 弹窗的 js */
$(document).ready(function() {
	var permissionChangeModal = document.getElementById('permissionChangeModal');
	// 1. 监听 Modal 的打开事件
	permissionChangeModal.addEventListener('show.bs.modal', function (event){	// 自动生成 event 对象 
		// 这里的 event.relatedTarget 就是上面那个 <a> 标签！
		// 获取触发模态框的按钮
		console.log("Modal is opening");
		var button = event.relatedTarget; // 所以这里是点击修改的那个按钮
		console.log("The button that opened the modal is:", button);
		// 从按钮的 data-permission-id 属性中提取账户 ID
		
		// 1.2. 从按钮上读取所有 data-* 属性的值
	    var permissionId = button.getAttribute('data-permission-id');
	    var permissionName = button.getAttribute('data-permission-name');
	    var permissionUri = button.getAttribute('data-permission-uri');
	    var permissionC = button.getAttribute('data-permission-c') === 'true'; // 将字符串转回布尔值
	    var permissionR = button.getAttribute('data-permission-r') === 'true';
	    var permissionU = button.getAttribute('data-permission-u') === 'true';
	    var permissionD = button.getAttribute('data-permission-d') === 'true';
		
		console.log("The extracted permissionId value is:", permissionId);
		
		// 1.3. 找到模态框内部对应的表单元素 (使用 jQuery 会更方便)
	    var modalForm = $(permissionChangeModal); // 将原生 DOM 转为 jQuery 对象

	    // 1.4. 将读取到的值，设置到对应的表单字段中
	    modalForm.find('#permissionId').val(permissionId);
	    modalForm.find('#permissionName').val(permissionName); 
	    modalForm.find('#permissionUri').val(permissionUri);     
	    
	    // 对于 Checkbox，需要设置其 checked 属性
	    modalForm.find('#c').prop('checked', permissionC); 
	    modalForm.find('#r').prop('checked', permissionR);
	    modalForm.find('#u').prop('checked', permissionU);
	    modalForm.find('#d').prop('checked', permissionD);
		
		/* 将ID设置到表单的隐藏字段中 为什么需要这一步呢
		因为你的模态框（Modal）是“公用”的，而你要修改密码的用户是“特定”的。
		这个操作就是为了告诉公用的表单，它这次到底为哪个特定的用户服务
		*/
		var modalFormPermissionId = permissionChangeModal.querySelector('#permissionId');
		modalFormPermissionId.value = permissionId;
	});
	
	// 2. 监听表单的提交事件
	$('#permissionChangeForm').on('submit', function(event){
		// 阻止表单的默认同步提交行为
		event.preventDefault();
		
		// 序列化表单
		var formData = $(this).serialize();
		console.log("formData:" + formData);
		
		// 3. 发送 AJAX 请求到后端, 第一次使用这个$.ajax(), 对比之前的登陆注册
		$.ajax({
			type: 'POST',
			url: '/api/permission/permissionModify', // Thymeleaf动态生成URL
			data: formData,
			success: function(response) {
				// 请求成功
				alert(response.message);
				$('#permissionChangeModal').modal('hide'); // 关闭模态框
				$('#permissionTable').bootstrapTable('refresh');	// 刷新表格！
				$('.modal-backdrop').remove(); 
		        // 同时确保 body 上的 modal-open 类被移除 (Bootstrap 应该会自动做，但可以加一道保险)
		        $('body').removeClass('modal-open');
			},
			error: function(xhr) {
				// 请求失败
				var errorMsg = xhr.responseJSON ? xhr.responseJSON.error : '发生未知错误';
                $('#password-error-alert').text(errorMsg).show(); // 在模态框内显示错误信息
			}
		});
	});
	// 4. 清理模态框状态
    permissionChangeModal.addEventListener('hidden.bs.modal', function (event) {
        // 关闭模态框时，清空表单内容和错误提示
        $('#permissionChangeForm')[0].reset();
        $('#password-error-alert').hide().text('');
    });
});

<!-- deleteById -->
function deleteById(id){
	console.log("即将删除的权限 ID:" + id)
	// 还可以是异步请求 ajax 去访问带有 json 访问结果的 controller
	// 删除的方法: 直接连接的方法访问controller里面的删除方法 -> 会页面跳转, 点击之后跳转到新的url
	// 最终返回一个 ResStat 类型的结果, 此处是使用 Map 实现
	if(confirm('您确定要删除 id 为' + id + '的权限吗？')) {
		// 用户点击了确定
		// 使用 Fetch API 发送异步请求
		fetch('/api/permission/delete/' + id, {method:'POST'})
		.then(response => {	// .then(response => response.json())
			if(!response.ok) {
				// 如果状态码不是 2xx，则抛出错误，进入 .catch()
                // 尝试解析错误信息，如果后端返回了 JSON 的话
                return response.json().then(errData => {
                	throw new Error(errData.message || `HTTP error! status: ${response.status}`);
                }).catch(() => {
                	// 如果解析 JSON 失败，则抛出通用错误
                    throw new Error(`HTTP error! status: ${response.status}`);
                });
			}
			// 如果状态码是 2xx，则解析 JSON
            return response.json(); 
		})
		.then(data => {
			// 走到这里，说明 response.ok 是 true 并且 JSON 解析成功
			if(data.success) {
				alert("删除成功");
				$('#permissionTable').bootstrapTable('refresh');
			} else {
				alert("删除失败:" + data.message);
			}
		})
		.catch(error => {
			console.error('删除时发生错误', error);
			alert("删除失败, 请查看控制台日志." + error.message);
		});
	}
}
