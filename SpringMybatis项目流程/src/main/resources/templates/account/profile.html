<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>自动化系统</title>
	<!-- 最新的 Bootstrap 核心 css 文件 -->
	<!-- 在url上 使用 @标签 可以帮我们 自动加上 contextpath -->
	<link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
	<!-- 最新的 Bootstrap 核心 JavaScript 文件 -->
	<script th:src="@{/js/common/jquery-3.4.1.min.js}" ></script>
	<script th:src="@{/js/bootstrap.min.js}" ></script>

</head>
<body>
<table id="accountTable"></table> <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/bootstrap-table@1.22.4/dist/bootstrap-table.min.js"></script>
<script src="/js/common/account-management.js"></script>

<!-- 页头 导航栏 ↓ -->
<nav class="navbar navbar-default">
  <div class="container-fluid">
    <!-- Brand and toggle get grouped for better mobile display -->
    <div class="navbar-header">
      <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1" aria-expanded="false">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" href="/index">首页</a>
    </div>

    <!-- Collect the nav links, forms, and other content for toggling -->
    <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
      <ul class="nav navbar-nav">
        <li class="active"><a href="#">公文流转 <span class="sr-only">公文流转</span></a></li>
        <li class="dropdown">
          <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">人员管理 <span class="caret"></span></a>
          <ul class="dropdown-menu">
            <li><a href="/account/list">用户列表</a></li>
            <li><a href="#">Another action</a></li>
            <li><a href="#">Something else here</a></li>
            <li role="separator" class="divider"></li>
            <li><a href="#">Separated link</a></li>
            <li role="separator" class="divider"></li>
            <li><a href="#">One more separated link</a></li>
          </ul>
        </li>
      </ul>
      <form class="navbar-form navbar-left">
        <div class="form-group">
          <input type="text" class="form-control" placeholder="请输入员工姓名">
        </div>
        <button type="submit" class="btn btn-default">搜索</button>
      </form>
      
      <!-- 对于未登录用户 -->
      <ul th:if="${session.account}==null" class="nav navbar-nav navbar-right">
        <li><a href="/account/register">注册</a></li>
        <li><a href="/account/login">登陆</a></li>
      </ul>
      <!-- 已登录用户 直接显示信息 -->
      <ul th:if="${session.account}!=null"class="nav navbar-nav navbar-right">
        <li class="dropdown active">
          <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">欢迎: [[${session.account.loginName}]] <span class="caret"><span class="badge">42</span></span></a>
          <ul class="dropdown-menu">
            <li><a href="/account/profile">个人信息</a></li>
            <li><a href="#">Another action</a></li>
            <li><a href="#">Something else here</a></li>
            <li role="separator" class="divider"></li>
            <li><a href="/account/logOut">退出登录</a></li>
          </ul>
        </li>
      </ul>
      <!-- 已登录用户 直接显示信息 ↑ -->
        
      
    </div><!-- /.navbar-collapse -->
  </div><!-- /.container-fluid -->
</nav>
<!-- 页头 导航栏 ↑ -->

<!-- 文件输入框 ↓ -->
<!-- 必须设置 enctype="multipart/form-data" 属性 -->
<div th:if="${session.account}!=null" class="container mt-4">
	<form th:action="@{/account/uploadAvatar}" method="post" enctype="multipart/form-data">
		<input type="hidden" id="accountId" name="accountId" th:value="${session.account.id}">
	    <div class="mb-3">
	        <label for="avatarFile" class="form-label">上传头像</label>
	        <input class="form-control" type="file" id="avatarFile" name="avatar"> 
	    </div>
	    <input type="submit" value="上传">
	</form>
</div>
<!-- 文件输入框 ↑ -->

<!-- script -->
<script type="text/javascript">


</script>
</body>
</html>
